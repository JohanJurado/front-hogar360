<form class="content__filter" [formGroup]="filterForm" (ngSubmit)="onSubmit()">
        <button type="button" class="btn btn--primary btn-filter" (click)="onToggleAdvanced()">
            <img src="./assets/img/filter-icon.svg" alt="Filter-icon">
            Filtros
        </button>
        <app-select
            class="input-location"
            placeholder="Filtro por departamento..."
            [service]="getDepartments"
            [disabled]="false"
            [required]="false"
            formControlName="nameDepartment"
            (getId)="onDepartmentChange($event)">
        </app-select>
        <button type="submit" class="btn btn--primary">Buscar</button>
        <div *ngIf="showAdvancedFilters" class="filter-options">
        <button class="no-btn close-icon" 
                (click)="onToggleAdvanced()"
                aria-label="Cerrar filtros">
            <img src="./assets/img/filter-icons/close-icon.svg" alt="">
        </button>
            <div class="order">
                <div class="column">
                    <p>Ordenar por:</p>
                    <div class="orderBy">
                        <label>
                            <input type="radio" name="orderBy" value="city" formControlName="orderBy">
                            <span class="radio-button__label">Ciudad</span>
                        </label>
                        <label>
                            <input type="radio" name="orderBy" value="department" formControlName="orderBy">
                            <span class="radio-button__label">Departamento</span>
                        </label>
                        <label>
                            <input type="radio" name="orderBy" value="bathroomCount" formControlName="orderBy">
                            <span class="radio-button__label">Baños</span>
                        </label>
                        <label>
                            <input type="radio" name="orderBy" value="bedroomCount" formControlName="orderBy">
                            <span class="radio-button__label">Habitaciones</span>
                        </label>
                        <label>
                            <input type="radio" name="orderBy" value="category" formControlName="orderBy">
                            <span class="radio-button__label">Categoria</span>
                        </label>
                        <label>
                            <input type="radio" name="orderBy" value="price" formControlName="orderBy">
                            <span class="radio-button__label">Precio</span>
                        </label>
                    </div>
                </div>
                <div class="column">
                    <p>Tipo:</p>
                    <div class="orderAsc">
                        <label>
                            <input type="radio" name="orderAsc" value="true" formControlName="orderAsc">
                            <span class="radio-button__label">Asc</span>
                        </label>
                        <label>
                            <input type="radio" name="orderAsc" value="" formControlName="orderAsc">
                            <span class="radio-button__label">Desc</span>
                        </label>
                    </div>
                </div>
            </div>
            <div class="filter-inputs">
                <p>Filtrar por:</p>
                <div class="row">
                    <app-select
                        class="input"
                        label="Departamento"
                        placeholder="Filtro por departamento..."
                        [service]="getDepartments"
                        [disabled]="false"
                        [required]="false"
                        formControlName="nameDepartment"
                        (getId)="onDepartmentChange($event)">
                    </app-select>

                    <app-select
                        class="input"
                        label="Ciudad"
                        placeholder="Filtro por ciudad..."
                        [service]="getCities"
                        [required]="false"
                        formControlName="nameCity"
                        [idObject]="idDepartment"
                        [disabled]="departmentExist()"
                        (getId)="onCityChange($event)">
                    </app-select>

                    <app-select
                        class="input"
                        label="Barrio/Sector"
                        placeholder="Filtro por barrio/sector..."
                        displayField="neighborhood"
                        [service]="getNeighborhoods"
                        [required]="false"
                        formControlName="neighborhood"
                        [idObject]="idCity"
                        [disabled]="cityExist()">
                    </app-select>
                </div>
                <div class="row">
                    <app-select
                        class="input"
                        label="Nombre de la Categoria"
                        placeholder="Filtro por categoria..."
                        [disabled]="false"
                        [required]="false"
                        [service]="getCategories"
                        formControlName="nameCategory">
                    </app-select>
                    <app-input 
                        class="input"
                        placeholder="Filtro por precio maximo"
                        label="Precio máximo"
                        type="number"
                        [showRequiredSymbol]="false"
                        formControlName="maxPrice"
                    ></app-input>
                    <app-input 
                        class="input"
                        placeholder="Filtro por precio minimo"
                        label="Precio mínimo"
                        type="number"
                        [showRequiredSymbol]="false"
                        formControlName="maxPrice"
                    ></app-input>
                </div>
                <div class="row">
                    <app-input 
                        class="input"
                        placeholder="Filtro por número de habitaciones"
                        label="Numero de habitaciones"
                        type="number"
                        [showRequiredSymbol]="false"
                        formControlName="bedroomCount"
                    ></app-input>
                    <app-input 
                        class="input"
                        placeholder="Filtro por número de baños"
                        label="Numero de baños"
                        type="number"
                        [showRequiredSymbol]="false"
                        formControlName="bathroomCount"
                    ></app-input>
                </div>
            </div>
            <div class="actions">
                <button type="button" class="btn btn--third" (click)="onReset()">Limpiar Filtros</button>
            </div>
        </div>
    </form>
