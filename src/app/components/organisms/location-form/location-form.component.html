<form class="form" [formGroup]="locationForm" (ngSubmit)="submit()">
    <app-select
        [label]="'Departamento'"
        [placeholder]="'Seleccione el departamento...'"
        [service]="getDepartments"
        [disabled]="false"
        [formControl]="departmentNameControl"
        (getId)="setDepartmentId($event)">
    </app-select>
    <app-select
        [label]="'Ciudad'"
        [placeholder]="'Seleccione la ciudad...'"
        [service]="getCities"
        [formControl]="cityNameControl"
        [idObject]="idDepartment"
        [disabled]="departmentExist()"
        (getId)="setCityId($event)">
    </app-select>
    <app-input 
        label="Barrio/Sector"
        type="text"
        placeholder="Ingresa el barrio o sector de la ubicacion"
        [formControl]="neighborhoodControl"
        [maxwidth]="maxLengthNeighborhood"
        [disabled]="cityExist()"
    ></app-input>

    <div class="form__actions">
        <button type="submit" class="btn btn--primary" [disabled]="locationForm.invalid">Crear</button>
    </div>
</form>
